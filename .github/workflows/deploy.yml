name: Deploy

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # Branch pushes deploy under the branch name (master → 'master'). There is
  # deliberately no 'prod' arm: the hardened production instance is deployed
  # manually via `--stage prod` (quickstart step 7) and CI never touches it
  # (issue #63).
  STAGE: >-
    ${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.number)
      || github.ref_name }}
  # Per-ref stage for the integration test suite, isolated from the preview/
  # prod stage so concurrent PRs never share test resources. The suite deploys
  # it in beforeAll and destroys it in afterAll (CI only — locally the stage
  # is kept between runs).
  TEST_STAGE: >-
    ${{ github.event_name == 'pull_request'
      && format('test-pr-{0}', github.event.number)
      || 'test-master' }}

jobs:
  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - run: vp install
      - run: vp check
      - name: Docs build
        run: vp run build
        working-directory: apps/docs
      - name: Integration tests
        run: vp test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  deploy:
    needs: test
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - run: vp install
      - name: Deploy
        run: vpx alchemy deploy --stage ${{ env.STAGE }} --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULL_REQUEST: ${{ github.event.number }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '24'
          cache: true
      - run: vp install
      - name: Safety Check
        # Defense-in-depth for a condition that currently cannot occur: this
        # job only runs on pull_request events, where STAGE always resolves to
        # pr-N (see the env block). Kept so a future edit to the triggers or
        # the STAGE expression fails here instead of destroying a long-lived
        # stage — hence it asserts the pr-N shape rather than testing for a
        # 'prod' name no stage in this repo actually has.
        run: |
          if ! [[ "${{ env.STAGE }}" =~ ^pr-[0-9]+$ ]]; then
            echo "ERROR: cleanup may only destroy pr-N preview stages, got '${{ env.STAGE }}'"
            exit 1
          fi
      - name: Destroy Preview
        run: vpx alchemy destroy --stage ${{ env.STAGE }} --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULL_REQUEST: ${{ github.event.number }}
      - name: Destroy Test Stage
        # Safety net: the integration suite destroys its own test-pr-N stage
        # at the end of each CI run, but a cancelled/crashed run can leave it
        # behind. Destroying an already-clean stage is a no-op.
        continue-on-error: true
        run: vpx alchemy destroy --stage test-pr-${{ github.event.number }} --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
