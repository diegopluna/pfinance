packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer
nodeLinker: hoisted

catalog:
  '@base-ui/react': ^1.6.0
  '@better-auth/expo': ^1.6.25
  '@cloudflare/workers-types': ^5.20260801.1
  '@libsql/client': ^0.17.4
  '@effect/platform-node': 4.0.0-beta.102
  '@tanstack/react-form': ^1.33.3
  '@tanstack/react-query': ^5.101.4
  '@tanstack/react-router': ^1.170.18
  '@tanstack/react-table': ^8.21.3
  '@tanstack/router-plugin': ^1.168.23
  '@types/node': ^24
  alchemy: 2.0.0-beta.67
  better-auth: ^1.6.27
  class-variance-authority: ^0.7.1
  date-fns: ^4.4.0
  drizzle-kit: 1.0.0-rc.4
  drizzle-orm: 1.0.0-rc.4
  effect: 4.0.0-beta.102
  hono: ^4.13.0
  lucide-react: ^0.539.0
  # Pinned exactly and shared by apps/web and apps/mobile so the workspace
  # resolves a single physical React. Under `nodeLinker: hoisted` two React
  # versions produce two copies in the web bundle, and hooks reached through
  # the second copy (better-auth's useSession -> nanostores) see a null
  # dispatcher. Expo 57 / React Native 0.86 pin 19.2.3, so that is the shared
  # version; bump both together when the Expo SDK moves.
  react: 19.2.3
  react-day-picker: ^10.0.1
  react-dom: 19.2.3
  recharts: ^3.10.1
  shadcn: ^3.8.5
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.7
  vite-plus: 0.2.7
  node-addon-api: ^8.9.1
  node-gyp: ^13.0.1
overrides:
  vite: 'catalog:'
  # packages/ui declares React as a peer (^19.0.0); pnpm's autoInstallPeers
  # otherwise resolves that range on its own and materializes a second copy
  # next to the catalog one. Overriding pins every react/react-dom spec in
  # the tree — direct, peer, and transitive — to the single catalog version.
  react: 'catalog:'
  react-dom: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
minimumReleaseAgeExclude:
  - hono@4.13.0
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  msw: false
  sharp: true
  workerd: true
