packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  '@cloudflare/workers-types': ^5.20260801.1
  '@effect/platform-node': 4.0.0-beta.102
  '@types/node': ^24
  alchemy: 2.0.0-beta.67
  effect: 4.0.0-beta.102
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.7
  vite-plus: 0.2.7
overrides:
  vite: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
minimumReleaseAgeExclude:
  - hono@4.13.0
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  workerd: true
